# Jadwal terbit analisa-saham.mhamzah.id.
#
# Format cron biasa: menit jam tanggal bulan hari-minggu (0/7 = Minggu).
# Jam mengikuti zona waktu server, yaitu Asia/Jakarta (WIB).
# Setelah mengubah berkas ini, jalankan: deploy/pasang-cron.sh
# (dan sesuaikan teks jadwal di deploy/web/index.html).

# Selasa–Sabtu 05:00 — bar hari bursa sebelumnya sudah final, jadi tanpa spanduk
# DRAFT, dan hasil penutupan Jumat sudah tayang sepanjang akhir pekan.
IDX_JADWAL="0 5 * * 2-6"

# Tiap hari 21:00.
CRYPTO_JADWAL="0 21 * * *"

# Tiap hari 18:00 — nilai ulang semua pilihan IDX dan crypto dengan harga terbaru.
HASIL_JADWAL="0 18 * * *"

# Opsi tambahan untuk src/scan.ts per pasar (sama seperti run.sh).
IDX_OPSI="--tanpa-idx"
CRYPTO_OPSI="--tanpa-idx"
HASIL_OPSI=""

# Akar situs yang disajikan nginx.
WEB_ROOT="${WEB_ROOT:-/var/www/html/analisa-saham}"
