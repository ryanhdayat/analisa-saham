# Situs statis hasil deploy/terbit.sh — salinan dari yang terpasang di
# /etc/nginx/sites-available/analisa-saham.mhamzah.id, termasuk baris
# "managed by Certbot". Di server baru, buang baris-baris certbot itu dulu
# (sertifikatnya belum ada), pasang, lalu:
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d analisa-saham.mhamzah.id --redirect
server {
  server_name analisa-saham.mhamzah.id;

  root /var/www/html/analisa-saham;
  index index.html;

  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;

  # Nama berkasnya sama dari hari ke hari (index.html, data/detail-N.json), jadi
  # peramban wajib memeriksa ulang supaya tidak menyajikan scan kemarin.
  add_header Cache-Control "no-cache" always;

  # Folder rilis hanya dijangkau lewat symlink /idx dan /crypto.
  location /rilis/ { return 404; }

  location / { try_files $uri $uri/ =404; }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/analisa-saham.mhamzah.id/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/analisa-saham.mhamzah.id/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = analisa-saham.mhamzah.id) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


  listen 80;
  listen [::]:80;
  server_name analisa-saham.mhamzah.id;
    return 404; # managed by Certbot


}